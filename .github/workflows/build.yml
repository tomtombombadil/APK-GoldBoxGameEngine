name: Build

# Every push: the APK built (the run's Artifacts: GoldBoxGameEngine-<version>-debug.apk,
# and the release APK - signed when the repository has the GOLDBOX_* secrets).
# A tag v<version> (= version.properties' versionName - or a release published on
# GitHub's site, which makes the tag): a GitHub release with
# GoldBoxGameEngine-<version>.apk, signed with the release key - the secrets are
# required for that (docs/FDROID.md, "The release key").
# Or Actions › Build › Run workflow with release_tag = v<versionName> (Tom, 2026-11-27: how Claude releases - its
# sessions can't push tags): the tag made on the run's commit and the release, as for a pushed tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create = v + versionName (version.properties), e.g. v0.9.6. Leave empty to just build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      # (the release's tag: a pushed v tag, or the dispatch's release_tag; empty - no release)
      REL_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: No game files in the repo
        run: |
          if git ls-files --recurse-submodules | grep -Ei '\.(dax|tlb|glb|ovr|cha|sav|ecl)$'; then
            echo "::error::game files must never be committed"; exit 1
          fi
      - name: The tag matches the version
        if: env.REL_TAG != ''
        run: |
          V=$(sed -n 's/^versionName=//p' version.properties)
          [ "v$V" = "$REL_TAG" ] || { echo "::error::tag $REL_TAG but versionName $V"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$REL_TAG" > /dev/null; then
            echo "::error::$REL_TAG exists already - a tag is never moved"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: SDK parts
        # (the runner's own Android SDK; android-actions/setup-android broke on a retired package, 2026-11-23)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.GOLDBOX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GOLDBOX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$REL_TAG" ]; then
            echo "::error::a release needs the release key: the GOLDBOX_* secrets (docs/FDROID.md)"; exit 1
          fi
      - name: Build
        env:
          GOLDBOX_KEYSTORE_PASSWORD: ${{ secrets.GOLDBOX_KEYSTORE_PASSWORD }}
          GOLDBOX_KEY_ALIAS: ${{ secrets.GOLDBOX_KEY_ALIAS }}
          GOLDBOX_KEY_PASSWORD: ${{ secrets.GOLDBOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # (Maven Central answers 429 at busy times: a pause and again, up to four times)
          for i in 1 2 3 4; do
            ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log && break
            grep -q "429" build.log || exit 1
            [ $i = 4 ] && exit 1
            echo "::warning::Maven Central said 429 - again in $((i * 60)) s"; sleep $((i * 60))
          done
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk dist/
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: GoldBoxGameEngine-apk
          path: dist/*.apk
      - name: Release
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${REL_TAG#v}
          CODE=$(sed -n 's/^versionCode=//p' version.properties)
          NOTES=fastlane/metadata/android/en-US/changelogs/$CODE.txt
          # (a release Tom made on GitHub's site - it made the tag - gets the APK and the notes; else made here)
          # (a dispatch: the tag made here, on the run's commit)
          if gh release view "$REL_TAG" > /dev/null 2>&1; then
            gh release upload "$REL_TAG" "dist/GoldBoxGameEngine-$V.apk" --clobber
            gh release edit "$REL_TAG" --title "Gold Box Game Engine $V" --notes-file "$NOTES"
          else
            gh release create "$REL_TAG" "dist/GoldBoxGameEngine-$V.apk" --target "$GITHUB_SHA" \
              --title "Gold Box Game Engine $V" --notes-file "$NOTES"
          fi
